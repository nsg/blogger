[package]
name = "blogger"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["multipart"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.2", features = ["form", "json"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors"] }
rust-embed = { version = "8", features = ["axum"] }
mime_guess = "2"
chrono = "0.4.44"
sha2 = "0.11.0"
hmac = "0.13.0"
toml = "1.1.4"
slug = "0.1.6"
rmcp = { version = "3.1.2", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
getrandom = "0.4.3"
base64 = "0.23.1"
